server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;

  add_header X-Content-Type-Options nosniff always;
  # Must not be no-referrer: Container Apps Easy Auth rejects state-changing
  # requests whose Referer is absent (403, substatus 60). same-origin still
  # withholds the referrer from cross-origin destinations.
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:7071 https:; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:7071;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-MS-CLIENT-PRINCIPAL $http_x_ms_client_principal;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_body_timeout 120s;
  }
}
