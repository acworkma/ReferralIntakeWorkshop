name: Publish and deploy

on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: Run the subscription deployment before publishing
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-referralintake
  LOCATION: eastus2
  CONTAINER_APP: ca-referralintake-web-dev
  FUNCTION_APP: func-referralintake-dev

jobs:
  deploy:
    # A VNet-connected runner is required once Function/ACR public access is disabled.
    runs-on: [self-hosted, linux, azure-vnet]
    environment: azure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if infrastructure
        if: inputs.deploy_infrastructure
        run: az deployment sub what-if --location "$LOCATION" --template-file infra/main.bicep --parameters infra/main.bicepparam

      - name: Register Entra app
        # Requires the deploying identity to hold a directory-level Entra role
        # (Application Administrator / Cloud Application Administrator, or the
        # Microsoft Graph Application.ReadWrite.All permission) — see docs/deployment.md.
        if: inputs.deploy_infrastructure
        run: echo "ENTRA_CLIENT_ID=$(pwsh -File scripts/register-entra-app.ps1)" >> "$GITHUB_ENV"

      - name: Deploy infrastructure
        if: inputs.deploy_infrastructure
        run: az deployment sub create --name "referral-${GITHUB_RUN_ID}" --location "$LOCATION" --template-file infra/main.bicep --parameters infra/main.bicepparam

      - name: Set Entra redirect URIs
        if: inputs.deploy_infrastructure
        run: pwsh -File scripts/set-entra-redirect-uris.ps1

      - name: Discover registry
        run: echo "ACR_NAME=$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)" >> "$GITHUB_ENV"

      - name: Build immutable images in ACR
        run: |
          az acr build -r "$ACR_NAME" -t "referral-web:${GITHUB_SHA}" web
          az acr build -r "$ACR_NAME" -t "referral-api:${GITHUB_SHA}" -f api/Dockerfile .

      - name: Roll out Container Apps revision
        run: |
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --container-name web --image "$LOGIN_SERVER/referral-web:${GITHUB_SHA}"
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --container-name api --image "$LOGIN_SERVER/referral-api:${GITHUB_SHA}"

      - name: Package and deploy Python Functions
        run: |
          cd api
          python -m pip install --target .python_packages/lib/site-packages -r requirements.txt
          zip -qr ../function.zip . -x 'tests/*' '__pycache__/*' '*.pyc'
          cd ..
          az functionapp deployment source config-zip -g "$RESOURCE_GROUP" -n "$FUNCTION_APP" --src function.zip
