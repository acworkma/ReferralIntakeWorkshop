services:
  api:
    build:
      context: ./api
    environment:
      LOCAL_MOCK_IDENTITY: "true"
      ALLOW_LOCAL_SYNTHETIC_EXTRACTION: "true"
      DATABASE_URL: sqlite:////data/referrals.db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "7071:7071"
    volumes:
      - referral-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7071/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:7071
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  referral-data:
